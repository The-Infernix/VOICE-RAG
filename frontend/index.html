<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VOICE RAG — Hacker House Goa 2026</title>
  <meta name="description" content="Ask naturally. Trace the answer. Every answer is grounded in retrieved evidence.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2363F3D2' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2363F3D2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Voice RAG home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
        <circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8"/>
        <circle cx="16" cy="16" r="2.6" fill="currentColor"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">VOICE RAG</span>
        <span class="brand-sub">HACKER HOUSE GOA 2026</span>
      </span>
    </a>
    <div class="topbar-actions">
      <div class="sys-status" id="sysStatus" title="System status">
        <span class="dot"></span><span id="sysStatusText">CONNECTING</span>
      </div>
      <button class="chip-btn" id="techToggle" aria-pressed="false" title="Show technical details">TECHNICAL MODE</button>
      <button class="icon-btn" id="historyBtn" aria-label="Open history" title="History">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v6l4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <div id="viewTop" class="view-top"></div>

    <div id="orbSlot" class="orb-slot">
      <canvas id="orbCanvas" aria-hidden="true"></canvas>
      <button id="orbButton" aria-label="Hold to speak, or press Space"></button>
    </div>

    <div id="viewBottom" class="view-bottom"></div>

    <div id="viewMain" class="view-main"></div>
  </main>

  <footer class="basebar">
    <div class="kb">
      <span class="micro">KNOWLEDGE BASE</span>
      <span class="kb-name">MSMARCO-XI</span>
    </div>
    <div class="kb-meta">
      <span id="kbPassages"></span>
      <span class="kb-src">ai4bharat/MSMARCO-XI</span>
    </div>
  </footer>

  <aside class="drawer" id="evidenceDrawer" role="dialog" aria-modal="true" aria-label="Evidence" aria-hidden="true"></aside>
  <aside class="drawer" id="historyPanel" role="dialog" aria-modal="true" aria-label="History" aria-hidden="true"></aside>
  <div class="modal-root" id="modalRoot" aria-hidden="true"></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <div class="sr-live" id="srLive" aria-live="polite"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
